<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kutumbam | Family Tree</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <h1>Kutumbam</h1>
    <p>Build your family tree by adding people and their relations.</p>

    <!-- Add starting person (head of the tree) -->
    <div id="initial-form-container">
      <h2>Add First Person</h2>
      <form id="initial-person-form">
        <label>
          Name:
          <input type="text" id="initial-name" required />
        </label>
        <label>
          Gender:
          <select id="initial-gender" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </label>
        <button type="submit">Start Tree</button>
      </form>
    </div>

    <!-- Central tree view -->
    <div class="tree-container">
      <div id="tree"></div>
    </div>

    <!-- Hover popup: add relations -->
    <div id="add-popup" class="hidden">
      <div class="popup-content">
        <h4>Add relation for <span id="popup-name"></span></h4>
        <button id="add-father">Add Father</button>
        <button id="add-mother">Add Mother</button>
        <button id="add-brother">Add Brother</button>
        <button id="add-sister">Add Sister</button>
        <button id="add-son">Add Son</button>
        <button id="add-daughter">Add Daughter</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
